name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint Markdown & Render Mermaid Diagrams
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint Markdown files
        run: npm run lint

      - name: Validate & render Mermaid diagrams + build site
        run: npm run build

      - name: Upload rendered diagrams and site artifact
        uses: actions/upload-artifact@v4
        with:
          name: architecture-site-preview
          path: dist/
          retention-days: 7
